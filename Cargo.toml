[workspace]
resolver = "2"
members = ["crates/jc-core", "crates/jc-client", "crates/jadecode-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
libc = "0.2"
jc-core = { path = "crates/jc-core" }

[profile.release]
# 배포 바이너리를 가볍게. 스택 트레이스가 필요하면 `--profile release-debug`를 쓴다.
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 4

[profile.release-debug]
inherits = "release"
debug = 1
strip = "none"

# GPUI가 끌어오는 zed-async-tar 0.5.0-zed 는 xattr 0.2 를 고정하는데,
# 그 판이 최신 libc(aarch64 linux)에서 `libc::ENOATTR`를 못 찾아 빌드가 깨진다.
# vendor/xattr 는 같은 API에 그 상수만 고친 사본이다.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

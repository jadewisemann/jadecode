name: CI

on:
  push:
    branches: ["main", "docs/**", "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 서버·CLI·벤치: 빠르고 GPU·시스템 라이브러리가 필요 없다.
  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - name: build (client 제외)
        run: cargo build --workspace --exclude jc-client --bins
      - name: build (client 데이터 계층, GPUI 없이)
        run: cargo build -p jc-client --bins
      - name: test (client 제외)
        run: cargo test --workspace --exclude jc-client

  # 클라이언트: GPUI가 X11/Wayland/Vulkan/fontconfig 헤더를 요구한다(리눅스).
  client:
    name: client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: client
      - name: linux 시스템 라이브러리
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xkb-dev libssl-dev pkg-config
      - name: build client (GPUI)
        run: cargo build -p jc-client --features ui --bins
      - name: test client
        run: cargo test -p jc-client --features ui

  # 서식·경고. 실패로 막지는 않고 결과만 보여 준다(첫 도입이라).
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: linux 시스템 라이브러리
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xkb-dev libssl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features jc-client/ui -- -D warnings

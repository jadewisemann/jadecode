[package]
name = "jc-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "jadecode 데스크톱 앱 (GPUI)"

[[bin]]
name = "jadecode-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc.workspace = true
jc-core.workspace = true
gpui = { version = "0.2.2", optional = true }
unicode-segmentation = { version = "1", optional = true }

[features]
# 기본은 화면 없이 빌드된다(헤드리스 확인용 --dump). 창을 쓰려면 `--features ui`.
default = []
ui = ["dep:gpui", "dep:unicode-segmentation"]
